
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicole's Birthday</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: #202126;
            color: #f4eadb;
            font-family: Georgia, serif;
            text-align: center;
        }

        h1 {
            margin: 35px 10px 12px;
            font-size: clamp(23px, 4vw, 36px);
            font-weight: normal;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #aaa39a;
            font: 11px Arial, sans-serif;
            letter-spacing: 4px;
        }

        .scene {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 430px;
            margin: 0 auto;
        }

        /* CAKE PLATFORM */

        .platform {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 310px;
            height: 12px;
            border-radius: 50%;
            background: #b89a70;
        }

        /* FLAT 2D CAKE LAYERS */

        .tier {
            position: absolute;
            left: 50%;
            visibility: hidden;
            transform: translate(-50%, -650px);
            border-radius: 3px;
            background: #69402c;
            border-bottom: 5px solid #482a20;
        }

        .tier::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: #a87850;
        }

        .bottom {
            bottom: 42px;
            width: 260px;
            height: 52px;
        }

        .middle {
            bottom: 94px;
            width: 200px;
            height: 48px;
        }

        .top {
            bottom: 142px;
            width: 140px;
            height: 44px;
        }

        /* FROSTING */

        .cream {
            position: absolute;
            left: 50%;
            height: 12px;
            visibility: hidden;
            opacity: 0;
            transform: translateX(-50%);
            z-index: 3;
        }

        .chocolate {
            background: #986044;
        }

        .vanilla {
            background: #f0dfbd;
        }

        .drip {
            position: absolute;
            top: 5px;
            width: 12px;
            border-radius: 0 0 6px 6px;
        }

        .drip:nth-child(1) {
            left: 12%;
            height: 20px;
        }

        .drip:nth-child(2) {
            left: 30%;
            height: 13px;
        }

        .drip:nth-child(3) {
            left: 53%;
            height: 18px;
        }

        .drip:nth-child(4) {
            left: 75%;
            height: 15px;
        }

        .chocolate .drip {
            background: #986044;
        }

        .vanilla .drip {
            background: #f0dfbd;
        }

        .cream-bottom {
            bottom: 83px;
            width: 260px;
        }

        .cream-middle {
            bottom: 135px;
            width: 200px;
        }

        .cream-top {
            bottom: 183px;
            width: 140px;
        }

        /* CANDLE */

        .candle {
            position: absolute;
            left: 50%;
            bottom: 186px;
            width: 11px;
            height: 42px;
            visibility: hidden;
            transform: translate(-50%, -650px);
            background: repeating-linear-gradient(
                45deg,
                #eee4d4 0px,
                #eee4d4 6px,
                #b18b60 6px,
                #b18b60 10px
            );
            border-radius: 2px;
            z-index: 5;
        }

        .wick {
            position: absolute;
            top: -5px;
            left: 5px;
            width: 2px;
            height: 6px;
            background: #211a17;
        }

        .flame {
            position: absolute;
            top: -25px;
            left: -1px;
            width: 13px;
            height: 22px;
            background: #ffb94f;
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 0 12px #ffae43;
            opacity: 0;
        }

        /* STRAIGHT-DOWN ANIMATIONS */

        .bottom {
            animation: drop 0.8s ease-in 0.5s forwards;
        }

        .cream-bottom {
            animation: creamIn 0.6s ease-out 1.35s forwards;
        }

        .middle {
            animation: drop 0.8s ease-in 2s forwards;
        }

        .cream-middle {
            animation: creamIn 0.6s ease-out 2.85s forwards;
        }

        .top {
            animation: drop 0.8s ease-in 3.5s forwards;
        }

        .cream-top {
            animation: creamIn 0.7s ease-out 4.35s forwards;
        }

        .candle {
            animation: drop 0.8s ease-in 5.15s forwards;
        }

        .flame {
            animation: ignite 0.5s ease-out 6s forwards,
                       flicker 0.5s ease-in-out 6.5s infinite alternate;
        }

        @keyframes drop {
            from {
                visibility: visible;
                transform: translate(-50%, -650px);
            }

            to {
                visibility: visible;
                transform: translate(-50%, 0);
            }
        }

        @keyframes creamIn {
            0% {
                visibility: visible;
                opacity: 0;
                transform: translate(-50%, -25px);
            }

            70% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            100% {
                visibility: visible;
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        @keyframes ignite {
            from {
                opacity: 0;
                transform: scale(0.2);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes flicker {
            from {
                transform: rotate(-5deg) scale(1);
            }

            to {
                transform: rotate(5deg) scale(0.9);
            }
        }

        /* BIRTHDAY MESSAGE */

        .message {
            margin-top: -5px;
            color: #e6c99a;
            font-size: 21px;
            letter-spacing: 1px;
            opacity: 0;
            animation: appear 1s ease 6.5s forwards;
        }

        .footer {
            margin-top: 12px;
            color: #aaa39a;
            font: 10px Arial, sans-serif;
            letter-spacing: 3px;
            opacity: 0;
            animation: appear 1s ease 6.5s forwards;
        }

        .birthday-wish {
            margin: 32px 12px 20px;
            color: #f4eadb;
            font-size: clamp(20px, 4vw, 27px);
            letter-spacing: 1px;
            opacity: 0;
            animation: appear 1.2s ease 7s forwards;
        }

        @keyframes appear {
            to {
                opacity: 1;
            }
        }

        @media (max-width: 400px) {
            h1 {
                letter-spacing: 1px;
            }

            .scene {
                transform: scale(0.88);
                transform-origin: top center;
                margin-bottom: -45px;
            }

            .birthday-wish {
                margin-top: 28px;
            }
        }
    </style>
</head>

<body>

    <h1>HAPPY BIRTHDAY!!</h1>

    <p class="subtitle">MADE JUST FOR YOU</p>

    <div class="scene">

        <div class="platform"></div>

        <div class="tier bottom"></div>

        <div class="cream chocolate cream-bottom">
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
        </div>

        <div class="tier middle"></div>

        <div class="cream chocolate cream-middle">
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
        </div>

        <div class="tier top"></div>

        <div class="cream vanilla cream-top">
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
        </div>

        <div class="candle">
            <div class="wick"></div>
            <div class="flame"></div>
        </div>

    </div>

    <div class="message">
        Make a wish.
    </div>

    <div class="footer">
        YOUR DAY. YOUR MOMENT.
    </div>

    <div class="birthday-wish">
        Happy Birthday, lovely!
    </div>

</body>
</html>
